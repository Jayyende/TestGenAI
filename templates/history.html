<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Analysis History</title>

    <style>

        body{
            font-family:Segoe UI, sans-serif;
            background:#eef2f7;
            padding:40px;
        }

        .container{
            max-width:1200px;
            margin:auto;
        }

        h1{
            text-align:center;
            color:#2563eb;
            margin-bottom:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
        }

        th{
            background:#2563eb;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f5f7fa;
        }

        .btn{
            display:inline-block;
            margin-top:25px;
            padding:12px 25px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:10px;
        }

        .btn:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>📊 Analysis History</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Filename</th>
            <th>Functions</th>
            <th>Quality Score</th>
            <th>Risk Level</th>
            <th>Date</th>
        </tr>

        {% for row in history %}

        <tr>

            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>

        </tr>

        {% endfor %}

    </table>

    <a href="/" class="btn">
        🏠 Back To Home
    </a>

</div>

</body>
</html>
